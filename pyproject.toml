[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-quant"
version = "0.1.0"
description = "A股/港股量化交易系统：数据、指标、回测、选股与 Web 控制台"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "futu-api>=5.0.0",
    "yfinance>=0.2.0",
    "holidays>=0.40",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "dash[diskcache]>=2.14.0",
    "dash-bootstrap-components>=1.4.0",
    "dash-extensions>=1.0.0",
    "plotly>=5.18.0",
    "diskcache>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

# 不改目录结构：按顶层包做包发现（utils 无 __init__.py，靠 namespaces）
[tool.setuptools.packages.find]
include = [
    "backtest*",
    "data*",
    "indicators*",
    "research*",
    "screener*",
    "strategy*",
    "web*",
    "utils*",
]
namespaces = true
